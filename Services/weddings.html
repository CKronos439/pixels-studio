<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weddings | Pixels Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Roboto:wght@400;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
        <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="weddings.css">
</head>
<body>

    <header class="weddings-hero">
        
        <a href="../services.html" class="floating-back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <div class="hero-overlay">
            <h1>WEDDINGS</h1>
            
            <a href="#" class="btn-book-session">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Book a Session
            </a>
        </div>
    </header>

    <section class="weddings-intro">
        <div class="container">
            <p class="intro-welcome">Welcome to Pixels Studio's Professional Photoshoot Catalogue.</p>
            <p class="intro-text">
                We specialize in Weddings. Browse through to see some of our favorite works, and when you're ready, you can book a session. Let's create something beautiful together.
            </p>
            
            <h3 class="projects-title">PROJECTS</h3>
            
            <div class="gallery-grid" id="gallery">
                <div class="gallery-item"><img src="../Assets/wedding 1.jpg" alt="wedding"></div>
                <div class="gallery-item"><img src="../Assets/wedding 2.jpg" alt="wedding"></div>
                <div class="gallery-item"><img src="../Assets/wedding 3.jpg" alt="wedding"></div>
            </div>
            <a href="#gallery" class="see-more-btn">See More</a>
        </div>
    </section>

    <script src="../main.js"></script>
</body>
</html>
